function drawSpectrumChart(now, selected){
  const cv = document.getElementById('spectrum-canvas');
  if(!cv) return;
  const dpr = window.devicePixelRatio||1;
  const w = cv.clientWidth||300, h=130;
  cv.width=w*dpr; cv.height=h*dpr;
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);

  const rootStyles = getComputedStyle(document.documentElement);
  const gridColor = (rootStyles.getPropertyValue('--line')||'#eee').trim();
  const labelColor = (rootStyles.getPropertyValue('--dim')||'#c2c2c8').trim();

  if(!now || !now.bands){
    ctx.fillStyle=labelColor; ctx.font='12px -apple-system, sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(now ? 'No spectrum data — added manually' : '', w/2, h/2);
    return;
  }

  const padL=30, padR=6, padT=6, padB=4;
  const plotW = w-padL-padR, plotH = h-padT-padB;
  const yForDb = db => padT + plotH*(1-((db-CHART_DB_MIN)/(CHART_DB_MAX-CHART_DB_MIN)));

  // gridlines + dB labels
  ctx.strokeStyle=gridColor; ctx.fillStyle=labelColor; ctx.font='9.5px -apple-system, sans-serif';
  ctx.textAlign='right'; ctx.textBaseline='middle';
  for(let db=Math.ceil(CHART_DB_MIN/6)*6; db<=CHART_DB_MAX; db+=6){
    const y = yForDb(db);
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w-padR, y); ctx.stroke();
    ctx.fillText(db+'dB', padL-5, y);
  }

  // vertical dividers between the 4 band columns
  const colW = plotW/4;
  ctx.strokeStyle=gridColor;
  for(let i=1;i<4;i++){
    const x = padL+colW*i;
    ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT+plotH); ctx.stroke();
  }

  function drawTrackLines(bands, color, lineWidth){
    BAND_KEYS.forEach((key,i)=>{
      const db = bands[key];
      const y = yForDb(Math.max(CHART_DB_MIN, Math.min(CHART_DB_MAX, db)));
      const x0 = padL+colW*i+colW*0.12, x1 = padL+colW*(i+1)-colW*0.12;
      ctx.strokeStyle=color; ctx.lineWidth=lineWidth; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.stroke();
    });
  }

  drawTrackLines(now.bands, '#b7b7bf', 4); // bold soft grey baseline

  if(selected && selected.bands){
    BAND_KEYS.forEach((key,i)=>{
      const score = bandCloseness(now.bands[key], selected.bands[key]);
      const color = pctColor(score);
      const db = selected.bands[key];
      const y = yForDb(Math.max(CHART_DB_MIN, Math.min(CHART_DB_MAX, db)));
      const x0 = padL+colW*i+colW*0.12, x1 = padL+colW*(i+1)-colW*0.12;
      ctx.strokeStyle=color; ctx.lineWidth=3; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.stroke();
    });
  }
}

let selectedMatchId = null;

function renderMatches(){
  const holder=document.getElementById('now-card-holder');
  const chartHolder=document.getElementById('chart-holder');
  const list=document.getElementById('match-list');
  const sectionLbl=document.getElementById('match-section');
  const now=library.find(t=>t.id===nowPlayingId);

  const wBpm=+document.getElementById('w-bpm').value;
  const wKey=+document.getElementById('w-key').value;
  const wBands=+document.getElementById('w-bands').value;
  const wLoud=+document.getElementById('w-loud').value;
  const wTotal=(wBpm+wKey+wBands+wLoud)||1;

  if(!now){
    holder.innerHTML=''; chartHolder.innerHTML='';
    sectionLbl.style.display='none';
    list.innerHTML = `<div class="empty-state">Pick your current track above to see your top 10 matches.</div>`;
    return;
  }

  holder.innerHTML = `<div class="now-card">
    <img class="art" src="${now.icon}">
    <div>
      <div class="lbl">NOW PLAYING</div>
      <div class="t">${escapeHtml(now.name)}</div>
      <div class="sub">${escapeHtml(now.artist||'Unknown artist')} · ${now.bpm} BPM · ${now.key.camelot} ${now.key.name} · ${fmtLoudness(now.loudness)}</div>
    </div>
  </div>`;

  chartHolder.innerHTML = renderChartCard();

  function scoreTrack(t){
    const bm=bpmMatchInfo(now.bpm,t.bpm);
    const bs=Math.round(bm.score);
    const kd=camelotDistance(now.key.camelot,t.key.camelot);
    const bandS=bandsScore(now.bands,t.bands); // null if either track has no spectrum data
    const loudDiff = (now.loudness==null||t.loudness==null) ? null : Math.abs(now.loudness-t.loudness);
    const loudS = loudnessScore(now.loudness,t.loudness); // null if either track has no loudness data
    // Only weigh the categories that actually have data for this pair, so a
    // manually-added vinyl entry (no bands/loudness) still ranks sensibly on
    // BPM + key instead of being penalized for data it was never given.
    const parts = [{score:bs,weight:wBpm},{score:kd.score,weight:wKey}];
    if(bandS!=null) parts.push({score:bandS, weight:wBands});
    if(loudS!=null) parts.push({score:loudS, weight:wLoud});
    const activeTotal = parts.reduce((s,p)=>s+p.weight,0)||1;
    const overall=Math.round(parts.reduce((s,p)=>s+p.score*p.weight,0)/activeTotal);
    return {t,bs,bm,kd,bandS,loudDiff,loudS,overall};
  }

  const eligible = library.filter(t=>t.id!==now.id && !playedTrackIds.has(t.id));
  // A saved Flow (from=now playing) means "last time, going into this track
  // worked great" — those get pinned above the algorithmic ranking.
  const flowToIds = new Set(flows.filter(f=>f.from===now.id).map(f=>f.to));
  const flowResults = eligible.filter(t=>flowToIds.has(t.id)).map(scoreTrack).sort((a,b)=>b.overall-a.overall);
  const regularResults = eligible.filter(t=>!flowToIds.has(t.id)).map(scoreTrack).sort((a,b)=>b.overall-a.overall);
  const results = [...flowResults, ...regularResults].slice(0,10);

  if(!results.some(r=>r.t.id===selectedMatchId)) selectedMatchId=null;

  if(results.length===0){
    sectionLbl.style.display='none';
    const allPlayed = library.length>1 && library.every(t=>t.id===now.id || playedTrackIds.has(t.id));
    list.innerHTML = allPlayed
      ? `<div class="empty-state">You've played everything in your crate this session — hit Reset below to start fresh.</div>`
      : `<div class="empty-state">Add more tracks to your library to see suggested matches.</div>`;
    drawSpectrumChart(now, null);
    updateChartCompare(null);
    return;
  }
  sectionLbl.style.display='block';

  list.innerHTML = results.map((r,i)=>{
    const rounded = Math.round(r.bm.absDiff);
    const arrow = r.bm.diff>0 ? '▲' : (r.bm.diff<0 ? '▼' : '');
    const tempoNote = r.bm.mult===2 ? ' · half-time' : (r.bm.mult===0.5 ? ' · double-time' : '');
    const bpmText = rounded===0 ? 'Exact tempo'+tempoNote : `${arrow} ${rounded} bpm${tempoNote}`;
    const compatible = r.kd.score>=40;
    const keyText = compatible ? '✓ Harmonically Compatible' : '✕ Not Harmonically Compatible';
    let loudRow;
    if(r.loudDiff==null){
      loudRow = `<span class="bd-text" style="color:var(--dim);font-weight:500;">No loudness data</span>`;
    } else {
      const loudArrow = (now.loudness - r.t.loudness) > 0 ? '▼' : ((now.loudness - r.t.loudness) < 0 ? '▲' : '');
      const loudText = r.loudDiff<0.3 ? 'Exact loudness' : `${loudArrow} ${r.loudDiff.toFixed(1)} dB ${r.t.loudness<now.loudness?'quieter':'louder'}`;
      loudRow = `<span class="bd-text" style="color:${loudnessDiffColor(r.loudDiff)}">${loudText} (${r.loudS}%)</span>`;
    }
    const isFlow = flowToIds.has(r.t.id);
    const flowBadge = isFlow ? `<div class="flow-badge">〜 Flow match</div>` : '';
    return `
    <div class="match-row${r.t.id===selectedMatchId?' open':''}${isFlow?' flow-match':''}" data-id="${r.t.id}">
      <div class="match-main">
        <div class="rank">${i+1}</div>
        <img class="art" src="${r.t.icon}" style="width:56px;height:56px;border-radius:7px;">
        <div class="match-info">
          ${flowBadge}
          <div class="t">${escapeHtml(r.t.name)}</div>
          <div class="a">${escapeHtml(r.t.artist||'Unknown artist')}</div>
        </div>
        <div class="pct-pill" style="background:${pctColorSoft(r.overall)};color:${pctColor(r.overall)}">${r.overall}%</div>
        <div class="chev">▾</div>
      </div>
      <div class="breakdown"><div class="breakdown-inner">
        <div class="bd-row"><span class="bl">BPM</span><span class="bd-text" style="color:${bpmDiffColor(r.bm.absDiff)}">${bpmText}</span></div>
        <div class="bd-row"><span class="bl">Key</span><span class="bd-text" style="color:${keyColor(r.kd.score)};font-weight:700;">${keyText}</span></div>
        <div class="bd-row"><span class="bl">Loudness</span>${loudRow}</div>
        <button class="now-playing-btn" data-setnow="${r.t.id}">
          <svg viewBox="0 0 20 20" width="14" height="14"><path d="M5 3.5 L16 10 L5 16.5 Z" fill="#fff"/></svg>
          Now Playing
        </button>
      </div></div>
    </div>`;
  }).join('');

  list.querySelectorAll('[data-setnow]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      selectNowPlaying(btn.dataset.setnow);
      document.querySelector('.app').scrollIntoView({behavior:'smooth', block:'start'});
    });
  });

  list.querySelectorAll('.match-row').forEach(row=>{
    row.querySelector('.match-main').addEventListener('click', ()=>{
      const id = row.dataset.id;
      selectedMatchId = (selectedMatchId===id) ? null : id;
      list.querySelectorAll('.match-row').forEach(r2=>r2.classList.toggle('open', r2.dataset.id===selectedMatchId));
      const sel = selectedMatchId ? results.find(r=>r.t.id===selectedMatchId) : null;
      drawSpectrumChart(now, sel ? sel.t : null);
      updateChartCompare(sel);
    });
  });

  const initialSel = selectedMatchId ? results.find(r=>r.t.id===selectedMatchId) : null;
  drawSpectrumChart(now, initialSel ? initialSel.t : null);
  updateChartCompare(initialSel);
}

function updateChartCompare(sel){
  const el = document.getElementById('chart-compare');
  if(!el) return;
  if(!sel){ el.innerHTML=''; return; }
  if(sel.bandS==null){ el.innerHTML = `<span style="color:var(--dim);">vs ${escapeHtml(sel.t.name)} — no spectrum data</span>`; return; }
  el.innerHTML = `<span class="swatch" style="background:${pctColor(sel.bandS)}"></span>vs ${escapeHtml(sel.t.name)} — <span class="pct" style="color:${pctColor(sel.bandS)}">${sel.bandS}%</span> band match`;
}
function fmtLoudness(v){ return v==null ? 'no loudness data' : v+' LUFS'; }

window.addEventListener('resize', ()=>{
  const now=library.find(t=>t.id===nowPlayingId);
  if(!now) return;
  const selRow = selectedMatchId ? library.find(t=>t.id===selectedMatchId) : null;
  drawSpectrumChart(now, selRow);

const PRESETS_KEY = 'cratebuddy:presets';
let weightPresets = [null,null,null];

async function loadPresets(){
  try{
    if(hasArtifactStorage){
      const r = await window.storage.get(PRESETS_KEY, false).catch(()=>null);
      weightPresets = r && r.value ? JSON.parse(r.value) : [null,null,null];
    } else {
      const raw = localStorage.getItem(PRESETS_KEY);
      weightPresets = raw ? JSON.parse(raw) : [null,null,null];
    }
  }catch(e){ weightPresets=[null,null,null]; }
  renderPresetRow();
}
async function savePresetsStorage(){
  try{
    if(hasArtifactStorage) await window.storage.set(PRESETS_KEY, JSON.stringify(weightPresets), false);
    else localStorage.setItem(PRESETS_KEY, JSON.stringify(weightPresets));
  }catch(e){ console.error('preset save failed', e); }
}
function currentWeights(){
  return {
    bpm:+document.getElementById('w-bpm').value,
    key:+document.getElementById('w-key').value,
    bands:+document.getElementById('w-bands').value,
    loud:+document.getElementById('w-loud').value,
  };
}
function applyWeights(w){
  ['bpm','key','bands','loud'].forEach(k=>{
    document.getElementById('w-'+k).value = w[k];
    document.getElementById('w-'+k+'-val').textContent = w[k];
  });
  renderMatches();
}
function renderPresetRow(){
  const el = document.getElementById('preset-row');
  if(!el) return;
  el.innerHTML = weightPresets.map((p,i)=>`
    <div class="preset-slot">
      <input class="preset-name" data-slot="${i}" ${p?'':'disabled'}
        placeholder="Preset ${i+1}" value="${escapeHtml(p&&p.name ? p.name : '')}">
      <button class="preset-load" data-slot="${i}" ${p?'':'disabled'}>Load</button>
      <button class="preset-save" data-slot="${i}" title="Save current weights to this slot">💾</button>
    </div>`).join('');
  el.querySelectorAll('.preset-load').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx=+btn.dataset.slot;
      if(weightPresets[idx]) applyWeights(weightPresets[idx]);
    });
  });
  el.querySelectorAll('.preset-save').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx=+btn.dataset.slot;
      const existingName = weightPresets[idx]&&weightPresets[idx].name;
      weightPresets[idx]={...currentWeights(), name: existingName || `Preset ${idx+1}`};
      savePresetsStorage();
      renderPresetRow();
    });
  });
  el.querySelectorAll('.preset-name').forEach(input=>{
    input.addEventListener('change', ()=>{
      const idx=+input.dataset.slot;
      if(!weightPresets[idx]) return;
      weightPresets[idx].name = input.value.trim() || `Preset ${idx+1}`;
      savePresetsStorage();
    });
  });
}

/* =========================================================
   EXPORT / IMPORT — manual backup for moving your crate between
   devices when not syncing through a Claude account.
========================================================= */
function showInfoToast(message, isError){
  const stack = document.getElementById('toast-stack');
  const t = document.createElement('div');
  t.className = 'toast' + (isError?' error':' success');
  t.innerHTML = `<div class="tbody"><div class="tname">${escapeHtml(message)}</div></div>`;
  stack.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),250); }, 2600);
}

function exportLibrary(){
  const payload = { app:'cratebuddy', version:1, exportedAt:Date.now(), library, weightPresets, flows };
  const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `cratebuddy-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showInfoToast(`Exported ${library.length} track${library.length===1?'':'s'}`, false);
}

function importLibraryFile(file){
  const reader = new FileReader();
  reader.onload = async ()=>{
    let payload;
    try{ payload = JSON.parse(reader.result); }
    catch(e){ showInfoToast("Couldn't read that file — is it a Crate Buddy backup?", true); return; }

    const importedTracks = Array.isArray(payload.library) ? payload.library : [];
    if(importedTracks.length===0 && !Array.isArray(payload.weightPresets) && !Array.isArray(payload.flows)){
      showInfoToast("That file doesn't look like a Crate Buddy backup", true);
      return;
    }

    // De-dupe by name+artist rather than id — the same song analyzed on two
    // different devices gets two different random ids, so id-matching alone
    // would just create duplicates.
    const norm = s => (s||'').trim().toLowerCase();
    let added=0, skipped=0;
    for(const t of importedTracks){
      const dupe = library.some(existing => norm(existing.name)===norm(t.name) && norm(existing.artist)===norm(t.artist));
      if(dupe){ skipped++; continue; }
      library.unshift(t);
      await persistTrackAdd(t);
      added++;
    }

    // Only fill preset slots that are empty on this device — never overwrite
    // a preset you've already saved locally.
    if(Array.isArray(payload.weightPresets)){
      let presetsChanged=false;
      for(let i=0;i<3;i++){
        if(!weightPresets[i] && payload.weightPresets[i]){ weightPresets[i]=payload.weightPresets[i]; presetsChanged=true; }
      }
      if(presetsChanged){ await savePresetsStorage(); renderPresetRow(); }
    }

    // Merge in any Flows not already saved here (matched by the from/to pair,
    // not id, same reasoning as track de-dupe above).
    if(Array.isArray(payload.flows)){
      let flowsAdded=0;
      for(const f of payload.flows){
        if(!f || !f.from || !f.to) continue;
        if(flows.some(existing=>existing.from===f.from && existing.to===f.to)) continue;
        flows.push(f);
        flowsAdded++;
      }
      if(flowsAdded>0) await saveFlows();
    }

    renderLibrary(); renderNowPlayingSelect(); updateCount();
    showInfoToast(`Imported ${added} track${added===1?'':'s'}${skipped?`, skipped ${skipped} duplicate${skipped===1?'':'s'}`:''}`, false);
  };
  reader.onerror = ()=> showInfoToast("Couldn't read that file", true);
  reader.readAsText(file);
}

document.getElementById('export-btn').addEventListener('click', exportLibrary);
document.getElementById('import-btn').addEventListener('click', ()=>document.getElementById('import-file-input').click());
document.getElementById('import-file-input').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(file) importLibraryFile(file);
  e.target.value='';
});

// Keeps crates/Flow clean when a track is deleted from the library entirely.
async function cleanupReferencesToTrack(id){
  let cratesChanged=false;
  crates.forEach(c=>{
    const before=c.trackIds.length;
    c.trackIds = c.trackIds.filter(tid=>tid!==id);
    if(c.trackIds.length!==before) cratesChanged=true;
  });
  if(cratesChanged) await saveCrates();
  const beforeFlows = flows.length;
  flows = flows.filter(f=>f.from!==id && f.to!==id);
  if(flows.length!==beforeFlows) await saveFlows();
}

// Small reusable search-and-pick input, used for adding tracks to a crate
// (multi-add: clears after each pick) and for the manual Flow form
// (single-select: keeps the chosen track's name showing).
function trackPickerHtml(idPrefix, placeholder){
  return `<div class="now-search" style="margin-bottom:10px;">
    <input type="text" id="${idPrefix}-input" placeholder="${placeholder}" autocomplete="off">
    <div class="now-suggestions" id="${idPrefix}-suggestions"></div>
  </div>`;
}
function wireTrackPicker(idPrefix, excludeIds, onPick, singleSelect){
  const input = document.getElementById(idPrefix+'-input');
  const box = document.getElementById(idPrefix+'-suggestions');
  if(!input || !box) return;
  function refresh(){
    const q = input.value.trim().toLowerCase();
    const matches = library.filter(t=>!excludeIds || !excludeIds.includes(t.id))
      .filter(t=>!q || t.name.toLowerCase().includes(q) || (t.artist||'').toLowerCase().includes(q))
      .slice(0,8);
    if(matches.length===0){ box.innerHTML=''; box.classList.remove('show'); return; }
    box.innerHTML = matches.map(t=>`
      <div class="now-suggestion-row" data-id="${t.id}">
        <img src="${t.icon}">
        <div><div class="t">${escapeHtml(t.name)}</div><div class="a">${escapeHtml(t.artist||'Unknown artist')}</div></div>
      </div>`).join('');
    box.classList.add('show');
    box.querySelectorAll('[data-id]').forEach(row=>{
      row.addEventListener('mousedown', e=>{
        e.preventDefault();
        const t = library.find(x=>x.id===row.dataset.id);
        onPick(row.dataset.id);
        if(singleSelect){ input.value = t ? t.name+(t.artist?' — '+t.artist:'') : ''; box.classList.remove('show'); }
        else { input.value=''; refresh(); }
      });
    });
  }
  input.addEventListener('input', refresh);
  input.addEventListener('focus', refresh);
  input.addEventListener('blur', ()=>setTimeout(()=>box.classList.remove('show'),150));
}

let openCrateId = null; // null = list view, '__flow__' = Flow crate, '__history__' = History folder, or a crate id
let manualFlowFrom = null, manualFlowTo = null;
let openHistorySessionId = null; // only relevant when openCrateId === '__history__'

function renderOrganise(){
  const listView = document.getElementById('organise-list-view');
  const detailView = document.getElementById('organise-detail-view');
  if(openCrateId===null){
    listView.style.display='block'; detailView.style.display='none';
    renderOrganiseList();
  } else {
    listView.style.display='none'; detailView.style.display='block';
    if(openCrateId==='__flow__') renderFlowDetail();
    else if(openCrateId==='__history__'){
      if(openHistorySessionId) renderHistorySessionDetail();
      else renderHistoryFolder();
    }
    else renderCrateDetail();
  }
}

function renderOrganiseList(){
  document.getElementById('flow-crate-count').textContent =
    flows.length + (flows.length===1 ? ' saved transition' : ' saved transitions');
  document.getElementById('history-folder-count').textContent =
    historySessions.length + (historySessions.length===1 ? ' saved session' : ' saved sessions');
  const el = document.getElementById('crates-list');
  if(crates.length===0){
    el.innerHTML = `<div class="lib-empty">No crates yet — create one below.</div>`;
  } else {
    el.innerHTML = crates.map(c=>`
      <div class="crate-card" data-crate="${c.id}">
        <div class="crate-card-icon">▤</div>
        <div class="crate-card-info">
          <div class="t">${escapeHtml(c.name)}</div>
          <div class="a">${c.trackIds.length} track${c.trackIds.length===1?'':'s'}</div>
        </div>
        <button class="del-crate" data-del-crate="${c.id}">✕</button>
        <div class="chev">›</div>
      </div>`).join('');
    el.querySelectorAll('[data-crate]').forEach(card=>{
      card.addEventListener('click', e=>{
        if(e.target.closest('[data-del-crate]')) return;
        openCrateId = card.dataset.crate;
        renderOrganise();
      });
    });
    el.querySelectorAll('[data-del-crate]').forEach(btn=>{
      btn.addEventListener('click', async e=>{
        e.stopPropagation();
        if(!confirm('Delete this crate? The tracks themselves stay in your library.')) return;
        crates = crates.filter(c=>c.id!==btn.dataset.delCrate);
        await saveCrates();
        renderOrganiseList();
      });
    });
  }
}
document.getElementById('open-flow-crate').addEventListener('click', ()=>{ openCrateId='__flow__'; renderOrganise(); });
document.getElementById('open-history-folder').addEventListener('click', ()=>{ openCrateId='__history__'; openHistorySessionId=null; renderOrganise(); });
document.getElementById('organise-back-btn').addEventListener('click', ()=>{
  if(openCrateId==='__history__' && openHistorySessionId){
    openHistorySessionId = null; // step back to the session list, not all the way out
  } else {
    openCrateId=null; manualFlowFrom=null; manualFlowTo=null; openHistorySessionId=null;
  }
  renderOrganise();
});

function renderHistoryFolder(){
  const el = document.getElementById('organise-detail-content');
  if(historySessions.length===0){
    el.innerHTML = `<div class="section-lbl">History</div><div class="lib-empty">No saved sessions yet — save one from the bottom of the Play tab.</div>`;
    return;
  }
  el.innerHTML = `<div class="section-lbl">History</div>` + historySessions.map(h=>`
    <div class="crate-card" data-session="${h.id}">
      <div class="crate-card-icon">🕘</div>
      <div class="crate-card-info">
        <div class="t">${escapeHtml(h.name)}</div>
        <div class="a">${h.trackIds.length} track${h.trackIds.length===1?'':'s'} · ${new Date(h.savedAt).toLocaleDateString()}</div>
      </div>
      <button class="del-crate" data-del-session="${h.id}">✕</button>
      <div class="chev">›</div>
    </div>`).join('');
  el.querySelectorAll('[data-session]').forEach(card=>{
    card.addEventListener('click', e=>{
      if(e.target.closest('[data-del-session]')) return;
      openHistorySessionId = card.dataset.session;
      renderOrganise();
    });
  });
  el.querySelectorAll('[data-del-session]').forEach(btn=>{
    btn.addEventListener('click', async e=>{
      e.stopPropagation();
      if(!confirm('Delete this saved session history?')) return;
      historySessions = historySessions.filter(h=>h.id!==btn.dataset.delSession);
      await saveHistorySessions();
      renderHistoryFolder();
    });
  });
}

function renderHistorySessionDetail(){
  const session = historySessions.find(h=>h.id===openHistorySessionId);
  const el = document.getElementById('organise-detail-content');
  if(!session){ openHistorySessionId=null; renderOrganise(); return; }
  const tracks = session.trackIds.map(id=>library.find(t=>t.id===id)).filter(Boolean);
  el.innerHTML = `<div class="section-lbl">${escapeHtml(session.name)}</div>` +
    (tracks.length===0 ? `<div class="lib-empty">None of these tracks are in your library anymore.</div>` :
     tracks.map((t,i)=>`
      <div class="organise-row">
        <span style="color:var(--dim);font-size:11px;width:16px;flex-shrink:0;">${i+1}</span>
        <img src="${t.icon}">
        <div><div class="t">${escapeHtml(t.name)}</div><div class="a">${escapeHtml(t.artist||'Unknown artist')}</div></div>
      </div>`).join(''));
}

document.getElementById('new-crate-btn').addEventListener('click', async ()=>{
  const name = prompt('Name this crate:');
  if(!name || !name.trim()) return;
  crates.push({id:'c_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), name:name.trim(), trackIds:[]});
  await saveCrates();
  renderOrganiseList();
});

function renderCrateDetail(){
  const crate = crates.find(c=>c.id===openCrateId);
  const el = document.getElementById('organise-detail-content');
  if(!crate){ openCrateId=null; renderOrganise(); return; }
  const tracks = crate.trackIds.map(id=>library.find(t=>t.id===id)).filter(Boolean);
  el.innerHTML = `
    <div class="section-lbl">${escapeHtml(crate.name)}</div>
    ${trackPickerHtml('crate-add','Add a track to this crate…')}
    <div id="crate-tracks-list">
      ${tracks.length===0 ? `<div class="lib-empty">No tracks yet.</div>` :
        tracks.map(t=>`
        <div class="organise-row">
          <img src="${t.icon}">
          <div><div class="t">${escapeHtml(t.name)}</div><div class="a">${escapeHtml(t.artist||'Unknown artist')}</div></div>
          <button class="remove-btn" data-remove="${t.id}">✕</button>
        </div>`).join('')}
    </div>`;
  wireTrackPicker('crate-add', crate.trackIds, async (id)=>{
    crate.trackIds.push(id);
    await saveCrates();
    renderCrateDetail();
  }, false);
  el.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      crate.trackIds = crate.trackIds.filter(id=>id!==btn.dataset.remove);
      await saveCrates();
      renderCrateDetail();
    });
  });
}

function renderFlowDetail(){
  const el = document.getElementById('organise-detail-content');
  const rows = flows.map((f,i)=>{
    const fromT = library.find(t=>t.id===f.from), toT = library.find(t=>t.id===f.to);
    if(!fromT || !toT) return '';
    return `<div class="flow-pair-row">
      <img src="${fromT.icon}">
      <span class="flow-pair-arrow">→</span>
      <img src="${toT.icon}">
      <div class="flow-pair-names">
        <div class="t">${escapeHtml(fromT.name)} → ${escapeHtml(toT.name)}</div>
      </div>
      <button class="remove-btn" data-remove-flow="${i}">✕</button>
    </div>`;
  }).join('');
  el.innerHTML = `
    <div class="section-lbl">Flow — saved transitions</div>
    ${flows.length===0 ? `<div class="lib-empty">No flows saved yet — build some from the Play tab, or add one manually below.</div>` : `<div id="flow-pairs-list">${rows}</div>`}
    <div class="section-lbl" style="margin-top:16px;">Add a flow manually</div>
    ${trackPickerHtml('flow-from','From track…')}
    ${trackPickerHtml('flow-to','Into track…')}
    <button class="edit-save" id="manual-flow-save" style="margin-top:4px;">Save flow</button>
  `;
  wireTrackPicker('flow-from', null, (id)=>{ manualFlowFrom=id; }, true);
  wireTrackPicker('flow-to', null, (id)=>{ manualFlowTo=id; }, true);
  document.getElementById('manual-flow-save').addEventListener('click', async ()=>{
    if(!manualFlowFrom || !manualFlowTo){ showInfoToast('Pick both a "from" and "into" track', true); return; }
    if(manualFlowFrom===manualFlowTo){ showInfoToast("Those can't be the same track", true); return; }
    await saveFlow(manualFlowFrom, manualFlowTo);
    manualFlowFrom=null; manualFlowTo=null;
    renderFlowDetail();
  });
  el.querySelectorAll('[data-remove-flow]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      flows.splice(+btn.dataset.removeFlow, 1);
      await saveFlows();
      renderFlowDetail();
    });
  });
}

/* =========================================================
   INIT
========================================================= */
loadLibrary();
loadPresets();
loadFlows();
loadCrates();
loadHistorySessions();

/* Landscape-only clock next to the play-history strip — CSS handles when
   it's actually visible, this just keeps its text current. */
function tickClock(){
  const el = document.getElementById('play-clock');
  if(!el) return;
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const ss = String(now.getSeconds()).padStart(2,'0');
  el.innerHTML = `${hh}:${mm}<span class="secs">:${ss}</span>`;
}
tickClock();
setInterval(tickClock, 1000);
populateManualKeySelect();
loadDarkMode();
</script>
